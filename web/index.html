<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111"><title>TrpShare — File Transfer</title>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#171717;--raised:#202020;--line:#303030;--soft:#9b9b9b;--text:#f1f1f1;--white:#fff;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input{font:inherit}button{color:inherit}.app{max-width:1440px;margin:auto;padding:26px 30px 36px}.top{display:flex;align-items:center;justify-content:space-between;padding:4px 0 22px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:13px}.brandmark{width:36px;height:36px;border:1px solid #555;border-radius:10px;display:grid;place-items:center;color:#fff}.brandmark svg{width:20px;height:20px}.brand h1{font-size:17px;line-height:1.15;margin:0;letter-spacing:.01em}.brand p{color:var(--soft);font-size:12px;margin:4px 0 0}.online{display:flex;align-items:center;gap:8px;color:#aaa;font-size:12px}.online:before{content:"";width:7px;height:7px;border-radius:50%;background:#eee;box-shadow:0 0 9px #aaa}.toolbar{display:flex;align-items:center;gap:9px;padding:18px 0}.button{background:#f1f1f1;color:#111;border:1px solid #f1f1f1;border-radius:7px;padding:9px 13px;font-weight:650;display:inline-flex;gap:8px;align-items:center;cursor:pointer}.button:hover{background:#d8d8d8}.button.secondary{background:#181818;color:#e5e5e5;border-color:#383838}.button.secondary:hover{background:#242424}.button svg{height:15px;width:15px}.upload input{display:none}.grow{flex:1}.search{width:min(240px,36vw);border:1px solid #363636;border-radius:7px;background:#171717;color:#eee;padding:9px 12px;outline:none}.search:focus{border-color:#888}.layout{display:grid;grid-template-columns:265px minmax(0,1fr);min-height:570px;border:1px solid #303030;border-radius:10px;overflow:hidden;background:#151515}.sidebar{border-right:1px solid var(--line);background:#141414;padding:16px 12px}.sidehead{display:flex;align-items:center;justify-content:space-between;color:#999;font-size:11px;text-transform:uppercase;letter-spacing:.12em;padding:1px 7px 11px}.tree{font-size:13px}.tree-node{min-width:0}.tree-row{height:32px;display:flex;align-items:center;gap:7px;padding:0 7px;border-radius:5px;cursor:pointer;color:#c7c7c7;white-space:nowrap}.tree-row:hover{background:#222}.tree-row.active{background:#303030;color:#fff}.tree-row .chev{width:12px;color:#858585;text-align:center;font-size:12px}.tree-row .folder-icon{width:15px;height:15px;color:#c6c6c6;flex:none}.tree-row .tree-name{overflow:hidden;text-overflow:ellipsis}.tree-children{padding-left:15px}.content{min-width:0}.crumbbar{min-height:54px;display:flex;align-items:center;gap:8px;padding:0 19px;border-bottom:1px solid var(--line);color:#888;font-size:12px}.crumb{border:0;padding:3px 0;background:transparent;color:#aaa;cursor:pointer}.crumb:hover{color:#fff}.crumb.current{color:#f3f3f3;font-weight:650;cursor:default}.slash{color:#565656}.table-head,.file-row{display:grid;grid-template-columns:minmax(220px,1fr) 120px 130px;align-items:center;gap:14px;padding:0 20px}.table-head{height:37px;text-transform:uppercase;letter-spacing:.09em;font-size:10px;color:#858585;border-bottom:1px solid #292929}.file-row{height:49px;border-bottom:1px solid #252525;color:#ddd}.file-row:last-child{border-bottom:0}.file-row:hover{background:#1d1d1d}.file-name{display:flex;min-width:0;align-items:center;gap:11px;color:#eee;text-decoration:none}.file-name:hover .filename{text-decoration:underline}.file-icon{width:17px;height:17px;flex:none;color:#bbb}.filename{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.type,.size{color:#929292;font-size:12px}.size{text-align:right;font-variant-numeric:tabular-nums}.empty{color:#888;text-align:center;padding:70px 20px}.status{min-height:22px;padding:11px 2px;color:#aaa;font-size:12px}.status.error{color:#eee}.foot{color:#747474;font-size:11px;margin-top:7px}.hidden{display:none!important}
@media(max-width:760px){.app{padding:18px 12px 24px}.top{padding-bottom:16px}.toolbar{flex-wrap:wrap;padding:13px 0}.grow{display:none}.search{flex:1;min-width:130px}.layout{grid-template-columns:1fr;min-height:0}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:10px}.sidehead{padding-bottom:6px}.tree{max-height:150px;overflow:auto}.tree-children{padding-left:12px}.table-head,.file-row{grid-template-columns:minmax(120px,1fr) 68px 78px;gap:8px;padding-inline:11px}.crumbbar{padding-inline:12px;overflow:auto;white-space:nowrap}.file-row{height:45px}.type,.size{font-size:11px}}
</style></head><body>
<div class="app">
<header class="top"><div class="brand"><div class="brandmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3.5 7.5h6l2 2h9v9a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18.5z"/><path d="M3.5 7.5V6A1.5 1.5 0 0 1 5 4.5h4l2 2h4"/></svg></div><div><h1>TrpShare</h1><p>Local file transfer</p></div></div><div class="online">Server online</div></header>
<div class="toolbar"><label class="button upload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m0 0L7 9m5-5 5 5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>Upload file<input id="picker" type="file"></label><button class="button secondary" id="refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18 6l2 2M4 16l2 2a7 7 0 0 0 12.4-3"/></svg>Refresh</button><div class="grow"></div><input class="search" id="search" type="search" placeholder="Filter this folder…" aria-label="Filter files"></div>
<main class="layout"><aside class="sidebar"><div class="sidehead"><span>Shared folders</span><span id="folder-count"></span></div><div id="tree" class="tree"></div></aside><section class="content"><nav id="breadcrumbs" class="crumbbar" aria-label="Breadcrumb"></nav><div class="table-head"><span>Name</span><span>Type</span><span style="text-align:right">Size</span></div><div id="listing"></div></section></main>
<div id="status" class="status" role="status"></div><div class="foot">Connected over your local network · Files stay on your laptop</div>
</div>
<script>
const $=s=>document.querySelector(s);let entries=[],current='';const icon=(folder)=>folder?'<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3.5 7.5h6l2 2h9v9A1.5 1.5 0 0 1 17 20H5a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M3.5 7.5V6A1.5 1.5 0 0 1 5 4.5h4l2 2h4"/></svg>':'<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3.5h8l4.5 4.5v12A.5.5 0 0 1 18 20.5H6a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1z"/><path d="M14 3.5V9h4.5M8 13h8M8 16h8"/></svg>';
const fmt=n=>{if(n<1024)return n+' B';const u=['KB','MB','GB','TB'];let i=-1;do{n/=1024;i++}while(n>=1024&&i<u.length-1);return n.toFixed(1)+' '+u[i]};
function parentOf(p){const i=p.lastIndexOf('/');return i<0?'':p.slice(0,i)}function baseOf(p){return p.split('/').pop()}
function treeModel(){const root={name:'Shared folder',path:'',children:[]};for(const e of entries.filter(x=>x.type==='directory')){const parts=e.path.split('/');let node=root,path='';for(const part of parts){path=path?path+'/'+part:part;let child=node.children.find(c=>c.name===part);if(!child){child={name:part,path,children:[]};node.children.push(child)}node=child}}return root}
function renderTree(){const root=treeModel(),folderCount=entries.filter(e=>e.type==='directory').length;$('#folder-count').textContent=folderCount?String(folderCount):'';const make=(node,level=0)=>{const kids=node.children.sort((a,b)=>a.name.localeCompare(b.name));const has=kids.length>0;const expanded=node.path===''||current===node.path||current.startsWith(node.path+'/');const wrap=document.createElement('div');wrap.className='tree-node';const row=document.createElement('div');row.className='tree-row'+(current===node.path?' active':'');row.style.paddingLeft=(7+(level?0:0))+'px';row.innerHTML='<span class="chev">'+(has?(expanded?'⌄':'›'):'')+'</span>'+icon(true)+'<span class="tree-name"></span>';row.querySelector('.tree-name').textContent=node.name;row.title=node.path||'Shared folder';row.onclick=()=>{if(current===node.path&&has&&node.path!==''){row.nextElementSibling?.classList.toggle('hidden')}else go(node.path)};wrap.append(row);if(has){const children=document.createElement('div');children.className='tree-children'+(expanded?'':' hidden');for(const c of kids)children.append(make(c,level+1));wrap.append(children)}return wrap};const mount=$('#tree');mount.replaceChildren(make(root));}
function renderCrumbs(){const nav=$('#breadcrumbs');nav.replaceChildren();const parts=current?current.split('/'):[];const chain=[{label:'Shared folder',path:''}];let p='';for(const part of parts){p=p?p+'/'+part:part;chain.push({label:part,path:p})}chain.forEach((c,i)=>{if(i){const sep=document.createElement('span');sep.className='slash';sep.textContent='/';nav.append(sep)}const b=document.createElement('button');b.className='crumb'+(i===chain.length-1?' current':'');b.textContent=c.label;b.onclick=()=>go(c.path);nav.append(b)});}
function renderListing(){const host=$('#listing');host.replaceChildren();const q=$('#search').value.trim().toLowerCase();const kids=entries.filter(e=>parentOf(e.path)===current&&e.name.toLowerCase().includes(q)).sort((a,b)=>a.type===b.type?a.name.localeCompare(b.name):a.type==='directory'?-1:1);if(!kids.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=q?'No matching items in this folder.':'This folder is empty.';host.append(empty);return}for(const e of kids){const row=document.createElement('div');row.className='file-row';const name=document.createElement(e.type==='directory'?'button':'a');name.className='file-name';name.innerHTML=icon(e.type==='directory')+'<span class="filename"></span>';name.querySelector('.filename').textContent=e.name;if(e.type==='directory'){name.style.cssText='border:0;background:none;text-align:left;font:inherit;cursor:pointer;padding:0';name.onclick=()=>go(e.path)}else name.href='/files/'+e.path.split('/').map(encodeURIComponent).join('/');const type=document.createElement('span');type.className='type';type.textContent=e.type==='directory'?'Folder':'File';const size=document.createElement('span');size.className='size';size.textContent=e.type==='directory'?'—':fmt(e.size);row.append(name,type,size);host.append(row)}}
function go(path){current=path;$('#search').value='';renderTree();renderCrumbs();renderListing();$('#status').textContent=''}
async function load(){const status=$('#status');try{const r=await fetch('/api/files');if(!r.ok)throw Error('Could not load shared folder');entries=await r.json();if(current&&!entries.some(e=>e.type==='directory'&&e.path===current))current='';renderTree();renderCrumbs();renderListing()}catch(err){status.className='status error';status.textContent=err.message}}
$('#refresh').onclick=load;$('#search').oninput=renderListing;$('#picker').onchange=async e=>{const f=e.target.files[0];if(!f)return;const status=$('#status');status.className='status';status.textContent='Uploading '+f.name+'…';try{const params=new URLSearchParams({name:f.name});if(current)params.set('path',current);const r=await fetch('/api/upload?'+params,{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:f});const data=await r.json();if(!r.ok)throw Error(data.error||'Upload failed');status.textContent='Uploaded '+f.name;await load()}catch(err){status.className='status error';status.textContent=err.message}finally{e.target.value=''}};load();
</script></body></html>
